# Generic paired-NPY tabular task config. Test paths are recorded, never read by run.
modality: tabular
task_type: binary
train_path: ../in_vehicle_coupon_recommendation/C_train.npy
train_labels_path: ../in_vehicle_coupon_recommendation/y_train.npy
validation_path: ../in_vehicle_coupon_recommendation/C_val.npy
validation_labels_path: ../in_vehicle_coupon_recommendation/y_val.npy
test_path: ../in_vehicle_coupon_recommendation/C_test.npy
test_labels_path: ../in_vehicle_coupon_recommendation/y_test.npy
target_column: label
metric: accuracy
feature_names:
  - temperature
  - time
  - coupon
  - expiration
  - gender
  - age
  - maritalStatus
  - has_children
  - education
  - occupation
  - income
  - Bar
  - CoffeeHouse
  - CarryAway
  - RestaurantLessThan20
  - Restaurant20To50
  - toCoupon_GEQ5min
  - toCoupon_GEQ15min
  - toCoupon_GEQ25min
  - direction_same
  - direction_opp
